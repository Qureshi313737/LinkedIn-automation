<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Post Dashboard</title>
<style>
  :root { --bg:#f3f2ef; --card:#fff; --text:#1d2226; --muted:#666; --line:#e6e6e6;
          --brand:#0a66c2; --ok:#1a7f37; --bad:#d1242f; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f24; --text:#e6e6e6; --muted:#9aa4ae; --line:#2b3138;
            --brand:#4c9be8; --ok:#3fb950; --bad:#f85149; --warn:#d29922; }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg);
         color:var(--text); margin:0; padding:16px; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { color:var(--brand); font-size: 22px; margin: 8px 0 16px; }
  .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .stat, .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--muted); font-size:12px; }
  .alert { border-left:4px solid var(--bad); }
  .card { margin-bottom:12px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; color:var(--muted); }
  .badge { font-weight:700; font-size:11px; padding:2px 8px; border-radius:20px; color:#fff; }
  .success { background:var(--ok); } .failed { background:var(--bad); } .dry_run { background:var(--warn); }
  .headline { font-weight:600; margin:8px 0 4px; }
  pre { white-space:pre-wrap; word-wrap:break-word; font-family:inherit; font-size:14px; line-height:1.5;
        margin:8px 0; padding:10px; background:var(--bg); border-radius:8px; }
  .error { color:var(--bad); font-size:13px; margin-top:6px; word-break:break-word; }
  button { border:1px solid var(--brand); color:var(--brand); background:transparent; border-radius:20px;
           padding:4px 12px; cursor:pointer; font-size:12px; }
  a { color:var(--brand); }
  details summary { cursor:pointer; font-size:13px; color:var(--brand); }
</style>
</head>
<body>
<main>
  <h1>LinkedIn AI Post Dashboard</h1>
  <div id="stats" class="stats"></div>
  <div id="list"><p id="loading">History load ho raha hai...</p></div>
</main>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const label = { success: 'POSTED', failed: 'FAILED', dry_run: 'TEST (not posted)' };

  function stat(value, text) { return `<div class="stat"><b>${esc(value)}</b><span>${esc(text)}</span></div>`; }

  fetch('history.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('list');
      if (!data.length) { list.innerHTML = '<p>Abhi tak koi run nahi hua hai.</p>'; return; }

      const ok = data.filter(r => r.status === 'success');
      const last = data[0];
      let html = stat(ok.length, 'Total posts published') +
                 stat(ok[0] ? ok[0].date.slice(0, 10) : 'Kabhi nahi', 'Last successful post') +
                 stat(label[last.status] || last.status, 'Latest run (' + last.date + ')');
      document.getElementById('stats').innerHTML = html;

      list.innerHTML = '';
      if (last.status === 'failed') {
        list.insertAdjacentHTML('beforeend',
          `<div class="card alert"><b>Latest run fail hua.</b><div class="error">${esc(last.error)}</div>
           <div class="meta" style="margin-top:6px">Fix karne ke steps README.md mein "Problem aaye to" section mein hain.</div></div>`);
      }

      data.forEach((item, i) => {
        const text = item.post_text || item.post_preview || '';
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="meta">
            <span class="badge ${esc(item.status)}">${esc(label[item.status] || item.status)}</span>
            <span>${esc(item.date)}</span>
            ${item.topic ? `<span>· ${esc(item.topic)}</span>` : ''}
            ${item.format ? `<span>· style: ${esc(item.format)}</span>` : ''}
            ${item.source_link ? `<span>· <a href="${esc(item.source_link)}" target="_blank" rel="noopener">source</a></span>` : ''}
          </div>
          ${item.headline ? `<div class="headline">${esc(item.headline)}</div>` : ''}
          ${text ? `<details ${i < 3 ? 'open' : ''}><summary>Post text</summary><pre>${esc(text)}</pre>
                    <button data-i="${i}">Copy post</button></details>` : ''}
          ${item.error ? `<div class="error">${esc(item.error)}</div>` : ''}`;
        list.appendChild(card);
      });

      list.addEventListener('click', e => {
        const i = e.target.dataset && e.target.dataset.i;
        if (i === undefined) return;
        const item = data[+i];
        navigator.clipboard.writeText(item.post_text || item.post_preview || '')
          .then(() => { e.target.textContent = 'Copied!'; });
      });
    })
    .catch(() => {
      document.getElementById('loading').textContent = 'History file abhi tak nahi bani — pehla run hone do.';
    });
</script>
</body>
</html>
